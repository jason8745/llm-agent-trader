<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Trading Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--panel:#161a20;--line:#252b34;--ink:#e6e8eb;--muted:#8a93a0;--accent:#f0b429;--up:#ef4444;--down:#22c55e;--mono:'Geist Mono',monospace}
*{box-sizing:border-box;margin:0}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;height:100vh;display:flex;flex-direction:column}
.up{color:var(--up)}.down{color:var(--down)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.bar b{font-family:'Geist';font-size:14px;color:var(--accent);margin-right:8px}
.bar select,.bar input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font:inherit}
.bar .sp{flex:1}.bar .muted{color:var(--muted)}
.split{flex:1;display:grid;grid-template-columns:minmax(520px,46%) 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{position:sticky;top:0;background:var(--bg);color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.n{text-align:right}
td.h{white-space:normal;font-family:'Geist';color:var(--muted);max-width:220px;line-height:1.35}
tbody tr{cursor:pointer}tbody tr:hover{background:#1b2028}
tbody tr[aria-selected=true]{background:#1f2630;box-shadow:inset 2px 0 0 var(--accent)}
.flag{color:var(--accent)}
.detail{overflow:auto;padding:16px 20px}
.dh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dh h2{font-size:18px;font-weight:600}.dh span{font-family:var(--mono);color:var(--muted);font-size:12px}
.hyp{color:var(--muted);margin:6px 0 14px;line-height:1.5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
.grid3>div{padding:10px 12px;border-right:1px solid var(--line)}.grid3>div:last-child{border:0}
.grid3 small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.grid3 .v{font-size:20px;font-weight:600;font-family:var(--mono);margin-top:2px}.grid3 .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px}
.tabs{display:flex;gap:2px;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;padding:8px 12px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
table.trades td,table.trades th{position:static}
table.trades tr.oos td{background:rgba(240,180,41,.05)}
pre{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:6px;margin-top:10px;overflow:auto;color:#cbd5e1}
@media(max-width:900px){body{height:auto}.split{grid-template-columns:1fr}.list{border-right:0;max-height:50vh}}
</style></head><body>
<div class="bar"><b>▍AGENT TRADER</b>
  <select id="f"><option value="">all strategies</option></select>
  <span class="muted">symbol</span><span>2330.TW 台積電</span>
  <span class="sp"></span><span class="muted">IS 70% / OOS 30% · fee 0.1425% · tax 0.3%</span></div>
<div class="split"><div class="list"><table><thead><tr><th>#</th><th>strategy</th><th>hypothesis</th><th class="n" data-k="is">IS</th><th class="n" data-k="oos">OOS ▾</th><th class="n">B&H</th><th class="n">MDD</th><th class="n">trd</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="detail" id="d"></section></div>
<script src="mock.js"></script>
<script>
const th={up:'#ef4444',dn:'#22c55e',eq:'#f0b429',bh:'#64748b',grid:'#252b34',text:'#8a93a0',oos:'rgba(240,180,41,.05)',font:'Geist Mono',bg:'#161a20'};
let filt='',sortK='oos',sel=RUNS[RUNS.length-1],tab='trades';
f.innerHTML+=[...new Set(RUNS.map(r=>r.strategy))].map(s=>`<option>${s}</option>`).join('');
f.onchange=()=>{filt=f.value;render()};
function render(){
  const rs=RUNS.filter(r=>!filt||r.strategy===filt).sort((a,b)=>b[sortK].ret-a[sortK].ret);
  rows.innerHTML=rs.map(r=>`<tr data-r="${r.id}" aria-selected="${r===sel}"><td>${r.id}</td><td>${r.strategy}</td><td class="h">${r.hyp}</td>
    <td class="n ${tone(r.is.ret)}">${pct(r.is.ret)}</td><td class="n ${tone(r.oos.ret)}">${pct(r.oos.ret)}${overfit(r)?' <span class="flag" title="IS 比 OOS 高 15% 以上，可能過擬合">⚑</span>':''}</td>
    <td class="n">${pct(r.bhOos.ret)}</td><td class="n">${pct(Math.min(r.is.mdd,r.oos.mdd))}</td><td class="n">${r.nTrades}</td></tr>`).join('');
  const r=sel;
  d.innerHTML=`<div class="dh"><h2>${r.strategy}</h2><span>${r.id} · ${r.at} · fast=${r.p.fast} slow=${r.p.slow}</span></div>
  <p class="hyp">${r.hyp}</p>
  <div class="grid3"><div><small>IN-SAMPLE</small><div class="v ${tone(r.is.ret)}">${pct(r.is.ret)}</div><div class="s">MDD ${pct(r.is.mdd)}</div></div>
  <div><small>OUT-OF-SAMPLE</small><div class="v ${tone(r.oos.ret)}">${pct(r.oos.ret)}</div><div class="s">MDD ${pct(r.oos.mdd)}</div></div>
  <div><small>BUY & HOLD (OOS)</small><div class="v">${pct(r.bhOos.ret)}</div><div class="s">MDD ${pct(r.bhOos.mdd)}</div></div></div>
  <div class="chart">${chartSVG(r,th,{H:400})}</div>
  <div class="tabs"><button data-t="trades" aria-selected="${tab==='trades'}">TRADES (${r.nTrades})</button><button data-t="code" aria-selected="${tab==='code'}">SOURCE</button></div>
  ${tab==='trades'?tradesTable(r):`<pre>${esc(source(r))}</pre>`}`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-r],[data-t],[data-k]');if(!t)return;
  if(t.dataset.r)sel=RUNS.find(r=>r.id===t.dataset.r);else if(t.dataset.t)tab=t.dataset.t;else sortK=t.dataset.k;render()});
render();
</script></body></html>
