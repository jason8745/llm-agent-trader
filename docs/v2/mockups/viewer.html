<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Trader Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1115;--panel:#161a20;--line:#252b34;--ink:#e6e8eb;--muted:#8a93a0;--accent:#f0b429;--up:#ef4444;--down:#22c55e;--mono:'Geist Mono',monospace}
*{box-sizing:border-box;margin:0}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;height:100vh;display:flex;flex-direction:column}
.up{color:var(--up)}.down{color:var(--down)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px}
.bar b{font-family:'Geist';font-size:14px;color:var(--accent);margin-right:8px}
.bar .sp{flex:1}.muted{color:var(--muted)}
.split{flex:1;display:grid;grid-template-columns:420px 1fr;min-height:0}
.list{overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column}
.mode{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.mode button{all:unset;padding:5px 10px;border-radius:4px;cursor:pointer;color:var(--muted);font-size:12px}
.mode button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
/* timeline mode (from A) */
.group{padding:14px 12px 4px}
.group h3{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:0 4px 10px}
.group h3 span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.steps{list-style:none;padding:0;position:relative}
.steps:before{content:"";position:absolute;left:15px;top:10px;bottom:10px;width:1px;background:var(--line)}
.steps button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:24px 1fr;gap:10px;width:100%;padding:8px 8px 8px 4px;border-radius:6px;cursor:pointer;position:relative}
.steps button:hover{background:#1b2028}
.steps button[aria-current=true]{background:#1f2630;box-shadow:inset 2px 0 0 var(--accent)}
.dot{width:23px;height:23px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
[aria-current=true] .dot{background:var(--accent);border-color:var(--accent);color:#111}
.hyp{font-family:'Instrument Serif',serif;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:10px}
.flag{color:var(--accent)}
/* ranked mode (from B) */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-k]{cursor:pointer}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}.n{text-align:right}
.rank tbody tr{cursor:pointer}.rank tbody tr:hover{background:#1b2028}
.rank tbody tr[aria-selected=true]{background:#1f2630;box-shadow:inset 2px 0 0 var(--accent)}
/* detail */
.detail{overflow:auto;padding:16px 20px}
.dh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dh h2{font-size:18px;font-weight:600}.dh span{font-family:var(--mono);color:var(--muted);font-size:12px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(240,180,41,.12);color:var(--accent)}
.dhyp{font-family:'Instrument Serif',serif;font-size:20px;line-height:1.35;margin:8px 0 14px}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
.grid3>div{padding:10px 12px;border-right:1px solid var(--line)}.grid3>div:last-child{border:0}
.grid3 small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
.grid3 .v{font-size:20px;font-weight:600;font-family:var(--mono);margin-top:2px}.grid3 .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:6px;height:460px;overflow:hidden}
.legend{font-family:var(--mono);font-size:11px;color:var(--muted);margin:6px 2px 0;display:flex;gap:16px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
.tabs{display:flex;gap:2px;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{all:unset;padding:8px 12px;cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
table.trades tr.oos td{background:rgba(240,180,41,.05)}
pre{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:6px;margin-top:10px;overflow:auto;color:#cbd5e1}
@media(max-width:900px){body{height:auto}.split{grid-template-columns:1fr}.list{border-right:0;max-height:55vh}.grid3{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="bar"><b>▍AGENT TRADER</b><span>2330.TW 台積電</span><span class="sp"></span><span class="muted">IS 70% / OOS 30% · fee 0.1425% · tax 0.3%</span></div>
<div class="split">
  <nav class="list"><div class="mode"><button data-mode="tl" aria-pressed="true">時間軸</button><button data-mode="rank" aria-pressed="false">排行</button></div><div id="lst"></div></nav>
  <section class="detail" id="d"></section>
</div>
<script src="mock.js"></script>
<script>
let mode='tl',sortK='oos',sel=RUNS[RUNS.length-1],tab='trades',chart=null;
const strats=[...new Set(RUNS.map(r=>r.strategy))];
const flag=r=>overfit(r)?' <span class="flag" title="IS 比 OOS 高 15% 以上，可能過擬合">⚑</span>':'';
const prev=r=>{const rs=RUNS.filter(x=>x.strategy===r.strategy),k=rs.indexOf(r);return k>0?rs[k-1]:null};
const diff=r=>{const p=prev(r);if(!p)return 'baseline';return Object.keys(r.p).filter(k=>r.p[k]!==p.p[k]).map(k=>`${k} ${p.p[k]}→${r.p[k]}`).join(', ')||'params unchanged'};

function renderList(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  if(mode==='tl'){lst.innerHTML=strats.map(s=>{const rs=RUNS.filter(r=>r.strategy===s),best=Math.max(...rs.map(r=>r.oos.ret));
    return `<div class="group"><h3>${s}<span>${rs.length} runs · best OOS ${pct(best)}</span></h3><ol class="steps">${rs.map((r,k)=>`<li><button data-r="${r.id}" aria-current="${r===sel}">
      <span class="dot">${k+1}</span><span><div class="hyp">${r.hyp}</div>
      <div class="m"><span>IS <b class="${tone(r.is.ret)}">${pct(r.is.ret)}</b></span><span>OOS <b class="${tone(r.oos.ret)}">${pct(r.oos.ret)}</b>${flag(r)}</span><span>${r.at}</span></div></span></button></li>`).join('')}</ol></div>`}).join('')}
  else{const rs=[...RUNS].sort((a,b)=>b[sortK].ret-a[sortK].ret);
    lst.innerHTML=`<table class="rank"><thead><tr><th>#</th><th>strategy</th><th class="n" data-k="is">IS${sortK==='is'?' ▾':''}</th><th class="n" data-k="oos">OOS${sortK==='oos'?' ▾':''}</th><th class="n">B&H</th><th class="n">MDD</th><th class="n">trd</th></tr></thead><tbody>${
    rs.map(r=>`<tr data-r="${r.id}" aria-selected="${r===sel}"><td>${r.id}</td><td>${r.strategy}</td><td class="n ${tone(r.is.ret)}">${pct(r.is.ret)}</td><td class="n ${tone(r.oos.ret)}">${pct(r.oos.ret)}${flag(r)}</td><td class="n">${pct(r.bhOos.ret)}</td><td class="n">${pct(Math.min(r.is.mdd,r.oos.mdd))}</td><td class="n">${r.nTrades}</td></tr>`).join('')}</tbody></table>`}
}

function renderDetail(){const r=sel;
  d.innerHTML=`<div class="dh"><h2>${r.strategy}</h2><span>${r.id} · ${r.at} · fast=${r.p.fast} slow=${r.p.slow}</span><span class="chip">${diff(r)}</span></div>
  <p class="dhyp">${r.hyp}</p>
  <div class="grid3"><div><small>IN-SAMPLE</small><div class="v ${tone(r.is.ret)}">${pct(r.is.ret)}</div><div class="s">MDD ${pct(r.is.mdd)}</div></div>
  <div><small>OUT-OF-SAMPLE</small><div class="v ${tone(r.oos.ret)}">${pct(r.oos.ret)}</div><div class="s">MDD ${pct(r.oos.mdd)}</div></div>
  <div><small>BUY & HOLD (OOS)</small><div class="v">${pct(r.bhOos.ret)}</div><div class="s">MDD ${pct(r.bhOos.mdd)}</div></div>
  <div><small>TRADES · WIN</small><div class="v">${r.nTrades} · ${(r.win*100).toFixed(0)}%</div><div class="s">closed round-trips</div></div></div>
  <div class="chart" id="chart"></div>
  <div class="legend"><span><i style="background:#f0b429"></i>strategy equity</span><span><i style="background:#64748b"></i>buy & hold</span><span><i style="background:rgba(240,180,41,.35);height:8px"></i>out-of-sample</span></div>
  <div class="tabs"><button data-t="trades" aria-selected="${tab==='trades'}">TRADES</button><button data-t="code" aria-selected="${tab==='code'}">SOURCE</button></div>
  ${tab==='trades'?tradesTable(r):`<pre>${esc(source(r))}</pre>`}`;
  drawChart(r);
}

function drawChart(r){
  if(chart){chart.remove();chart=null}
  const LC=window.LightweightCharts,el=document.getElementById('chart');
  if(!LC){el.innerHTML='<p style="padding:16px;color:#8a93a0">lightweight-charts failed to load (offline?)</p>';return}
  chart=LC.createChart(el,{autoSize:true,layout:{background:{type:'solid',color:'#161a20'},textColor:'#8a93a0',fontFamily:'Geist Mono',panes:{separatorColor:'#252b34'}},
    grid:{vertLines:{color:'#1d222a'},horzLines:{color:'#1d222a'}},rightPriceScale:{borderColor:'#252b34'},timeScale:{borderColor:'#252b34'},crosshair:{mode:0}});
  // ponytail: OOS band = full-height histogram on a hidden scale; swap for a series primitive in the real viewer
  const band=chart.addSeries(LC.HistogramSeries,{priceScaleId:'band',color:'rgba(240,180,41,.07)',priceLineVisible:false,lastValueVisible:false});
  chart.priceScale('band').applyOptions({scaleMargins:{top:0,bottom:0},visible:false});
  band.setData(bars.map((b,i)=>i>=SPLIT?{time:b.t,value:1}:{time:b.t}));
  const candles=chart.addSeries(LC.CandlestickSeries,{upColor:'#ef4444',downColor:'#22c55e',borderVisible:false,wickUpColor:'#ef4444',wickDownColor:'#22c55e'});
  candles.setData(bars.map(b=>({time:b.t,open:b.o,high:b.h,low:b.l,close:b.c})));
  LC.createSeriesMarkers(candles,r.trades.map(t=>t.side==='BUY'
    ?{time:t.t,position:'belowBar',color:'#ef4444',shape:'arrowUp',text:'B'}
    :{time:t.t,position:'aboveBar',color:'#22c55e',shape:'arrowDown',text:'S'}));
  const eq=chart.addSeries(LC.LineSeries,{color:'#f0b429',lineWidth:2,priceLineVisible:false,priceFormat:{type:'price',precision:0,minMove:1}},1);
  eq.setData(r.eq.map((v,i)=>({time:bars[i].t,value:v})));
  const bhS=chart.addSeries(LC.LineSeries,{color:'#64748b',lineWidth:1,lineStyle:2,priceLineVisible:false,priceFormat:{type:'price',precision:0,minMove:1}},1);
  bhS.setData(bh.map((v,i)=>({time:bars[i].t,value:v})));
  try{chart.panes()[1].setHeight(150)}catch(e){}
  chart.timeScale().fitContent();
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-r],[data-t],[data-k],[data-mode]');if(!t)return;
  if(t.dataset.mode){mode=t.dataset.mode;return renderList()}
  if(t.dataset.k){sortK=t.dataset.k;return renderList()}
  if(t.dataset.t){tab=t.dataset.t;return renderDetail()}
  sel=RUNS.find(r=>r.id===t.dataset.r);renderList();renderDetail()});
renderList();renderDetail();
</script></body></html>
