<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本二（改） 看盤桌</title><link rel="stylesheet" href="base.css">
<script src="../../../../src/trader/viewer/lightweight-charts.js"></script><script src="mock-data.js"></script><script src="common.js"></script>
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
.desk{flex:1;display:grid;grid-template-columns:272px minmax(0,1fr) 384px;min-height:0}
.side{border-right:1px solid var(--line);overflow:auto}
.side .tools{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.ctx{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ctx .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctx h1{font-size:18px;font-weight:600}.ctx .sname{font-size:13px}
.pchip{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pchip b{color:var(--ink);font-weight:500}.pchip.x{border-color:rgba(240,180,41,.5);background:rgba(240,180,41,.07)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto auto;gap:2px 10px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;min-width:150px;transition:border-color .15s,background .15s}
.seg button:hover{border-color:#3a4350}.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button.on{border-color:var(--accent);background:rgba(240,180,41,.08)}
.seg .t{grid-column:1/3;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.seg .k{font-family:var(--mono);font-size:11px;color:var(--muted)}.seg .k b{font-weight:600}
.charts{flex:1;display:grid;grid-template-rows:minmax(0,52fr) minmax(0,28fr) minmax(0,20fr);gap:8px;padding:10px 16px;min-height:0}
.panel{position:relative;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:baseline;gap:12px;font-size:12px;color:var(--muted);margin-bottom:4px;min-height:18px;flex-wrap:wrap}
.ph b{color:var(--ink);font-size:12.5px}
.readout{font-family:var(--mono);font-size:11.5px;color:var(--muted)}.readout b{color:var(--ink);font-weight:500}
.panel .chart{flex:1;min-height:0}
.drawer{border-top:1px solid var(--line)}
.drawer .tabs{display:flex;gap:2px;padding:0 12px;align-items:center}
.drawer .tabs button{all:unset;cursor:pointer;padding:9px 12px;font-size:12px;color:var(--muted)}
.drawer .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.drawer .tabs .sp{flex:1}.drawer .tabs .tog{color:var(--muted);font-size:12px}
.right{border-left:1px solid var(--line);overflow:auto;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.verdict{font-size:15px;line-height:1.6;font-weight:500}
.score{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;font-family:var(--mono);font-size:12px}
.score div{padding:6px 4px;border-bottom:1px solid var(--line)}.score .hd{color:var(--muted);font-size:11px;font-family:var(--sans)}
.score .lb{font-family:var(--sans);color:var(--muted)}.score .v{text-align:right}.score .v small{display:block;color:var(--muted);font-size:10.5px}
.score .x{background:rgba(240,180,41,.05)}
.check{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}
.check .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(34,197,94,.15);color:var(--down)}
.fi{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:12px 0 0}
.fi:first-of-type{margin-top:0}
.fi .lab{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.fi .lab .n{font-family:var(--mono);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.fi p{font-size:13px;line-height:1.65}
.fi .ins{margin-top:6px;background:rgba(240,180,41,.07);border-radius:6px;padding:7px 9px;font-size:13px;line-height:1.65}
.fi .ins b{color:var(--accent);font-weight:600;margin-right:4px}
.reg{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;font-size:12px;align-items:center}
.reg .bar{grid-column:1/4;display:grid;grid-template-columns:44px 1fr;gap:2px 8px;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:-2px 0 6px}
.reg .track{height:6px;background:var(--panel2);border-radius:3px;position:relative;align-self:center}
.reg .fill{position:absolute;top:0;bottom:0;border-radius:3px}
details.more summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
details.more summary::before{content:"▸ ";}details.more[open] summary::before{content:"▾ "}
</style></head><body>
<div class="topbar"><b>▍AGENT TRADER</b><span>~/my-research</span><span class="sp"></span><span>紅漲綠跌</span></div>
<div class="desk">
 <nav class="side"><div class="tools"><span>研究</span><span>依股票分組</span></div><div id="tree"></div></nav>
 <section class="center">
  <div class="ctx">
   <div class="row"><h1>2330.TW 台積電</h1><span class="sname">ma_trend</span><span class="badge done">已定稿</span>
    <span class="pchip">策略開發期間 <b>2023-01-01 至 2024-12-31</b></span><span class="pchip x">策略執行期間 <b>2025-01-01 至 2025-12-31</b></span></div>
   <div class="seg" id="seg"></div>
  </div>
  <div class="charts">
   <div class="panel"><div class="ph"><b>K 線與成交量</b><span class="readout" id="r1"></span></div><div class="chart" id="c1"></div></div>
   <div class="panel"><div class="ph"><b>累積報酬率</b><span><i style="display:inline-block;width:14px;height:2px;background:#f0b429;vertical-align:middle"></i> 策略</span><span><i style="display:inline-block;width:14px;border-top:2px dashed #94a3b8;vertical-align:middle"></i> 買進並持有</span><span class="readout" id="r2"></span></div><div class="chart" id="c2"></div></div>
   <div class="panel"><div class="ph"><b>回撤</b><span class="mu">策略執行期間以初始資金重新開始，回撤由 0 起算</span><span class="readout" id="r3"></span></div><div class="chart" id="c3"></div></div>
  </div>
  <div class="drawer"><div class="tabs"><button class="on">成交明細</button><button>已平倉交易</button><button>最深回撤</button><button>盤勢分段</button><button>策略原始碼</button><span class="sp"></span><span class="tog">展開 ▴</span></div></div>
 </section>
 <aside class="right" id="right"></aside>
</div>
<script>
const st = M.study, r = M.run, c = r.chart, m = Object.fromEntries(r.metrics.map((x) => [x.label, x])), t = Object.fromEntries(r.trade_metrics.map((x) => [x.label, x]));
document.getElementById("tree").innerHTML = treeHTML();
document.getElementById("seg").innerHTML = st.iterations.map((it) => `<button class="${it.id === 1 ? "on" : ""}"><span class="t">第 ${it.n} 次 · ${esc(it.params)}${it.final ? ' <span class="badge done">定稿</span>' : ""}${it.overfit ? FLAG : ""}</span><span class="k">開發 <b class="${tone(it.dev_ret)}">${it.dev_ret}</b></span><span class="k">執行 <b class="${tone(it.exec_ret)}">${it.exec_ret}</b></span></button>`).join("");

const findings = [
 ["策略執行期間報酬率 +49.10%，高於買進並持有基準的 +46.41%；最大回撤 -14.88%，低於基準的 -30.43%。", "本策略的價值不在提高報酬率，而在以明顯較小的回撤取得相近的報酬；Sharpe 比率 1.83 高於基準的 1.38，風險調整後的表現較佳。"],
 ["策略開發期間報酬率 +71.44%，落後於買進並持有基準的 +146.56%。", "2023 至 2024 年台積電處於長期上漲，均線出場訊號造成未能參與部分漲幅。預期單邊強勢多頭時，本策略不如持有。"],
 ["2025-01-03 至 2025-04-09 的下跌段，股價下跌 -26.98%，策略報酬率為 -5.53%。", "均線條件在中期下跌中及時出場，是本策略降低回撤的主要來源；策略的優勢集中在下跌段。"],
 ["2023-01-03 至 2023-09-20 的三段盤整段中，策略報酬率分別為 +0.00%、-4.05%、-3.11%。", "盤整期間均線反覆交叉造成小幅虧損，若要改善，可考慮加入趨勢強度條件以減少盤整期間的進出。"],
 ["策略執行期間僅有 1 筆已平倉交易，勝率 0.00%。", "執行期間的結果主要取決於一次進出場時點，統計可信度有限；建議延長策略執行期間或以其他標的驗證。"],
];
const regs = r.regimes;
document.getElementById("right").innerHTML = `
<section class="card"><h3>結論<span class="badge done">已定稿 2026-11-21</span></h3>
 <p class="verdict">本策略以明顯較小的回撤取得與買進並持有相近的報酬，適用於重視風險控制的投資人；但在強勢多頭期間會落後於持有。</p></section>
<section class="card"><h3>兩段期間對照<span class="mu" style="font-weight:400">策略／買進並持有</span></h3>
 <div class="score"><div class="hd"></div><div class="hd v">策略開發期間</div><div class="hd v x">策略執行期間</div>
 ${[["報酬率","總報酬率"],["年化報酬率","年化報酬率"],["最大回撤","最大回撤"],["Sharpe 比率","Sharpe 比率（無風險利率 0）"]].map(([l,k]) => `<div class="lb">${l}</div><div class="v ${tone(m[k].dev)}">${m[k].dev}<small>${m[k].bh_dev}</small></div><div class="v x ${tone(m[k].exec)}"><b>${m[k].exec}</b><small>${m[k].bh_exec}</small></div>`).join("")}
 <div class="lb">交易次數</div><div class="v">${t["交易次數"].dev}</div><div class="v x">${t["交易次數"].exec}</div></div>
 <div class="check"><span class="ic">✓</span><span>過度擬合檢查：開發期間年化報酬率 ${m["年化報酬率"].dev}，執行期間 ${m["年化報酬率"].exec}，未達警示門檻（開發期間高出逾 15 個百分點）。</span></div></section>
<section class="card"><h3>發現與洞察</h3>
 ${findings.map(([f, i], n) => `<div class="fi"><div class="lab"><span class="n">${n + 1}</span>發現</div><p>${esc(f)}</p><div class="ins"><b>洞察</b>${esc(i)}</div></div>`).join("")}</section>
<section class="card"><h3>盤勢表現<span class="mu" style="font-weight:400">股價漲跌幅／策略報酬率</span></h3>
 <div class="reg">${regs.map((g) => `<span><span class="rdot ${g.kind}"></span>${g.label}</span><span class="mu" style="font-family:var(--mono);font-size:11px">${g.start} 至 ${g.end}</span><span style="font-family:var(--mono);font-size:11.5px"><span class="${tone(g.price_change)}">${g.price_change}</span> / <b class="${tone(g.strategy)}">${g.strategy}</b></span>`).join("")}</div></section>
<section class="card"><details class="more"><summary>完整績效指標與交易統計</summary><div style="margin-top:10px">${metricsHTML(r)}${tradesHTML(r)}</div></details></section>`;

// cumulative return, execution chained to the development end point
const E = (p, arr) => arr.map((v) => v + 1000000);
const devS = E("dev", c.pnl_dev).map((v) => (v / 1e6 - 1) * 100), devB = E("dev", c.bh_pnl_dev).map((v) => (v / 1e6 - 1) * 100);
const kS = 1 + devS.at(-1) / 100, kB = 1 + devB.at(-1) / 100;
const exS = E("exec", c.pnl_exec).map((v) => (kS * v / 1e6 - 1) * 100), exB = E("exec", c.bh_pnl_exec).map((v) => (kB * v / 1e6 - 1) * 100);
const dates2 = [...c.dev_dates, ...c.exec_dates], cumS = [...devS, ...exS], cumB = [...devB, ...exB], ddAll = [...c.dd_dev, ...c.dd_exec];

class Labels {
  constructor(items) { this.items = items; }
  attached({ chart }) { this.chart = chart; }
  paneViews() { return [{ zOrder: () => "top", renderer: () => ({ draw: (tg) => tg.useBitmapCoordinateSpace((s) => {
    const ts = this.chart.timeScale(), k = s.horizontalPixelRatio, ctx = s.context;
    for (const it of this.items) { const x1 = ts.timeToCoordinate(it.start), x2 = ts.timeToCoordinate(it.end); if (x1 === null || x2 === null || x2 - x1 < (it.min || 54)) continue;
      ctx.font = `${11 * k}px -apple-system,"PingFang TC",sans-serif`; ctx.fillStyle = it.color || "rgba(230,232,235,0.85)"; ctx.fillText(it.text, (x1 + 6) * k, (it.y || 14) * k);
      if (it.sub) { ctx.fillStyle = "rgba(138,147,160,0.95)"; ctx.font = `${10.5 * k}px ui-monospace,Menlo,monospace`; ctx.fillText(it.sub, (x1 + 6) * k, ((it.y || 14) + 14) * k); } }
  }) }) }]; }
}
const LBL = { up: "上漲段", down: "下跌段", range: "盤整段" };
const price = drawPrice(c1, c);
price.panes()[0].getSeries()[0].attachPrimitive(new Labels(regs.map((g) => ({ start: g.start, end: g.end, text: g.label, sub: g.price_change, min: 70 }))));

const p2 = makeChart(c2);
const s2 = p2.addSeries(LC.LineSeries, { color: "#f0b429", lineWidth: 2, priceLineVisible: false, lastValueVisible: true, priceFormat: fmtPct });
s2.setData(ser(dates2, cumS));
const b2 = p2.addSeries(LC.LineSeries, { color: "#94a3b8", lineWidth: 1.5, lineStyle: 2, priceLineVisible: false, lastValueVisible: true, priceFormat: fmtPct });
b2.setData(ser(dates2, cumB));
s2.attachPrimitive(new Bands([{ start: c.exec_dates[0], end: c.exec_dates.at(-1), color: "rgba(240,180,41,0.06)" }], c.exec_dates[0]));
s2.attachPrimitive(new Labels([
  { start: c.dev_dates[0], end: c.dev_dates.at(-1), text: "策略開發期間", sub: `策略 ${m["總報酬率"].dev}　買進並持有 ${m["總報酬率"].bh_dev}` },
  { start: c.exec_dates[0], end: c.exec_dates.at(-1), text: "策略執行期間", sub: `策略 ${m["總報酬率"].exec}　買進並持有 ${m["總報酬率"].bh_exec}`, color: "#f0b429" }]));
p2.timeScale().fitContent();

const p3 = makeChart(c3);
const devDD = p3.addSeries(LC.AreaSeries, { lineColor: "rgba(34,197,94,0.45)", topColor: "rgba(34,197,94,0.02)", bottomColor: "rgba(34,197,94,0.14)", lineWidth: 1, priceLineVisible: false, lastValueVisible: false, priceFormat: fmtPct, invertFilledArea: true });
devDD.setData(ser(c.dev_dates, c.dd_dev));
const exDD = p3.addSeries(LC.AreaSeries, { lineColor: "#22c55e", topColor: "rgba(34,197,94,0.05)", bottomColor: "rgba(34,197,94,0.4)", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, priceFormat: fmtPct, invertFilledArea: true });
exDD.setData(ser(c.exec_dates, c.dd_exec));
devDD.attachPrimitive(new Bands([{ start: c.exec_dates[0], end: c.exec_dates.at(-1), color: "rgba(240,180,41,0.06)" }], c.exec_dates[0]));
devDD.attachPrimitive(new Labels([{ start: c.dev_dates[0], end: c.dev_dates.at(-1), text: `最大回撤 ${m["最大回撤"].dev}`, y: 14 }, { start: c.exec_dates[0], end: c.exec_dates.at(-1), text: `最大回撤 ${m["最大回撤"].exec}`, color: "#f0b429", y: 14 }]));
p3.timeScale().fitContent();
sync([price, p2, p3]);

const at = (arr, ds) => Object.fromEntries(ds.map((d, i) => [d, arr[i]]));
const O = at(c.open, c.dates), H = at(c.high, c.dates), L = at(c.low, c.dates), C = at(c.close, c.dates), V = at(c.volume, c.dates), CS = at(cumS, dates2), CB = at(cumB, dates2), DD = at(ddAll, dates2);
function readout(time) {
  const d = time || c.dates.at(-1);
  r1.innerHTML = `<b>${d}</b>　開 <b>${groupDigits(O[d], 2)}</b>　高 <b>${groupDigits(H[d], 2)}</b>　低 <b>${groupDigits(L[d], 2)}</b>　收 <b>${groupDigits(C[d], 2)}</b>　量 <b>${groupDigits(V[d], 0)}</b>`;
  r2.innerHTML = d in CS ? `策略 <b>${groupDigits(CS[d], 2)}%</b>　買進並持有 <b>${groupDigits(CB[d], 2)}%</b>` : "";
  r3.innerHTML = d in DD ? `回撤 <b>${groupDigits(DD[d], 2)}%</b>` : "";
}
[price, p2, p3].forEach((ch) => ch.subscribeCrosshairMove((p) => readout(p.time)));
readout();
</script></body></html>
