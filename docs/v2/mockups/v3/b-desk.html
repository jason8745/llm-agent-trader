<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="base.css"><script src="../../../../src/trader/viewer/lightweight-charts.js"></script><script src="mock-data.js"></script><script src="common.js"></script><title>版本二 看盤桌</title>
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.desk{flex:1;display:grid;grid-template-columns:300px 1fr 400px;min-height:0}
.side{border-right:1px solid var(--line);overflow:auto}.right{border-left:1px solid var(--line);overflow:auto;padding:14px 16px}
.center{display:grid;grid-template-rows:auto auto 1fr 22px 210px 22px 140px;padding:12px 14px;gap:6px;min-height:0}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.head h1{font-size:18px;font-weight:600}
.iters{display:flex;gap:6px}.iters button{all:unset;font-family:var(--mono);font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.iters button.on{border-color:var(--accent);color:var(--ink);background:rgba(240,180,41,.08)}
.lab{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}
.right h3{font-size:13px;margin:14px 0 8px}.right h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-family:var(--mono);font-size:12px}
.kv .h{color:var(--muted);font-size:11px}.kv span:nth-child(3n+1){font-family:var(--sans);color:var(--muted)}
.concl p{font-size:13px;line-height:1.7}
.reg{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;font-family:var(--mono);font-size:11.5px;align-items:center}
.pchip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}.pchip.x{border-color:rgba(240,180,41,.45);color:var(--ink)}
</style></head><body>
<div class="topbar"><b>▍AGENT TRADER</b><span>~/my-research</span><span class="sp"></span><span>紅漲綠跌</span></div>
<div class="desk"><nav class="side" id="tree"></nav>
<section class="center">
 <div class="head"><h1>2330.TW 台積電</h1><span class="sname">ma_trend</span><span class="pchip">開發 2023-01-01 至 2024-12-31</span><span class="pchip x">執行 2025-01-01 至 2025-12-31</span></div>
 <div class="iters"><button class="on">#1 定稿 fast 20 slow 60</button><button>#2 fast 10 slow 30</button><button>#3 fast 20 slow 120</button></div>
 <div class="chart" id="c1"></div>
 <div class="lab"><b style="color:var(--ink)">策略損益（新臺幣）</b><span><i style="display:inline-block;width:14px;height:2px;background:#f0b429;vertical-align:middle"></i> 策略</span><span><i style="display:inline-block;width:14px;height:2px;background:#64748b;vertical-align:middle"></i> 買進並持有</span></div>
 <div class="chart" id="c2"></div>
 <div class="lab"><b style="color:var(--ink)">回撤</b></div>
 <div class="chart" id="c3"></div>
</section>
<aside class="right" id="right"></aside></div>
<script>
const st = M.study, r = M.run;
document.getElementById("tree").innerHTML = treeHTML();
const pick = ["總報酬率","年化報酬率","最大回撤","Sharpe 比率（無風險利率 0）","Calmar 比率","年化波動率"];
const tp = ["交易次數","勝率","獲利因子","平均持有交易日","持倉時間比例"];
document.getElementById("right").innerHTML = `
<h3>績效（策略／買進並持有）</h3>
<div class="kv"><span class="h"></span><span class="h">開發期間</span><span class="h">執行期間</span>
${r.metrics.filter((x) => pick.includes(x.label)).map((x) => `<span>${x.label.replace("（無風險利率 0）","")}</span><span class="${tone(x.dev)}">${x.dev}<br><span class="mu">${x.bh_dev}</span></span><span class="${tone(x.exec)} b">${x.exec}<br><span class="mu" style="font-weight:400">${x.bh_exec}</span></span>`).join("")}</div>
<h3>交易統計</h3>
<div class="kv"><span class="h"></span><span class="h">開發期間</span><span class="h">執行期間</span>${r.trade_metrics.filter((x) => tp.includes(x.label)).map((x) => `<span>${x.label}</span><span>${x.dev}</span><span class="b">${x.exec}</span>`).join("")}</div>
<h3>盤勢分段（股價／策略）</h3>
<div class="reg">${r.regimes.map((g) => `<span><span class="rdot ${g.kind}"></span>${g.label}</span><span class="mu">${g.start.slice(2)}～${g.end.slice(2)}</span><span class="${tone(g.price_change)}">${g.price_change}</span><span class="${tone(g.strategy)} b">${g.strategy}</span>`).join("")}</div>
<h3>結論分析</h3><div class="concl">${markdown(st.conclusion)}</div>`;
sync([drawPrice(c1, r.chart), drawPnl(c2, r.chart), drawDD(c3, r.chart)]);
</script></body></html>
