<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="base.css"><script src="../../../../src/trader/viewer/lightweight-charts.js"></script><script src="mock-data.js"></script><script src="common.js"></script><title>版本一 研究報告</title>
<style>
.wrap{display:grid;grid-template-columns:360px 1fr}.side{border-right:1px solid var(--line);min-height:calc(100vh - 42px)}
main{padding:22px 28px 60px;max-width:1180px}
h1{font-size:22px;font-weight:600;display:flex;gap:12px;align-items:baseline}h1 .sname{font-size:14px}
.pchips{display:flex;gap:8px;margin:10px 0}.pchip{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--line)}.pchip.x{border-color:rgba(240,180,41,.45);background:rgba(240,180,41,.08)}
.q{font-family:var(--serif);font-size:19px;line-height:1.45;margin:6px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:10px}.card h3 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}.kpi small{color:var(--muted);font-size:12px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;margin:4px 0 2px}.kpi .s{font-family:var(--mono);font-size:11px;color:var(--muted)}
.kpi.main{border-color:rgba(240,180,41,.45)}
h4{font-size:13px;margin:18px 0 8px}.two{display:grid;grid-template-columns:3fr 2fr;gap:18px}
</style></head><body>
<div class="topbar"><b>▍AGENT TRADER</b><span>~/my-research</span><span class="sp"></span><span>紅漲綠跌</span></div>
<div class="wrap"><nav class="side" id="tree"></nav><main id="main"></main></div>
<script>
const st = M.study, r = M.run, m = Object.fromEntries(r.metrics.map((x) => [x.label, x]));
document.getElementById("tree").innerHTML = treeHTML();
document.getElementById("main").innerHTML = `
<h1>${esc(st.label)}<span class="sname">${esc(st.strategy)}</span><span class="badge done">已定稿</span></h1>
<div class="pchips"><span class="pchip">策略開發期間　${esc(st.dev)}</span><span class="pchip x">策略執行期間　${esc(st.exec)}</span></div>
<p class="q">${esc(st.question)}</p>
<div class="kpis">
 <div class="kpi main"><small>策略執行期間報酬率</small><div class="v ${tone(m["總報酬率"].exec)}">${m["總報酬率"].exec}</div><div class="s">買進並持有 ${m["總報酬率"].bh_exec}</div></div>
 <div class="kpi"><small>策略開發期間報酬率</small><div class="v ${tone(m["總報酬率"].dev)}">${m["總報酬率"].dev}</div><div class="s">買進並持有 ${m["總報酬率"].bh_dev}</div></div>
 <div class="kpi"><small>策略執行期間最大回撤</small><div class="v down">${m["最大回撤"].exec}</div><div class="s">買進並持有 ${m["最大回撤"].bh_exec}</div></div>
 <div class="kpi"><small>策略執行期間 Sharpe 比率</small><div class="v">${m["Sharpe 比率（無風險利率 0）"].exec}</div><div class="s">開發期間 ${m["Sharpe 比率（無風險利率 0）"].dev}</div></div>
</div>
<section class="card concl"><h3>結論分析<small>定稿於 ${esc(st.finalized_at)}</small></h3>${markdown(st.conclusion)}</section>
<section class="card"><h3>迭代比較<small>調整只依策略開發期間；策略執行期間用於檢驗是否過度擬合</small></h3>${iterHTML(st)}</section>
<section class="card"><h3>第 1 次迭代（定稿）<small>fast=20, slow=60</small></h3>
 <h4>K 線與成交量</h4><div class="legend">${legendRegimes}</div><div class="chart" id="c1" style="height:400px"></div>
 <h4>策略損益（新臺幣）</h4><div class="legend"><span><i class="ln" style="background:#f0b429"></i>策略</span><span><i class="ln" style="background:#64748b"></i>買進並持有</span></div><div class="chart" id="c2" style="height:220px"></div>
 <h4>回撤</h4><div class="chart" id="c3" style="height:150px"></div>
 <div class="two"><div><h4>績效指標</h4>${metricsHTML(r)}</div><div><h4>交易統計</h4>${tradesHTML(r)}</div></div>
 <h4>盤勢分段</h4><p class="mu" style="font-size:12px;margin-bottom:6px">${esc(r.regime_rules)}</p>${regimesHTML(r)}
</section>`;
sync([drawPrice(c1, r.chart), drawPnl(c2, r.chart), drawDD(c3, r.chart)]);
</script></body></html>
